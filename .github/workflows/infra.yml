name: Provision Infra (EKS + ECR)

on:
  workflow_dispatch:   # manual trigger only

jobs:
  provision:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Delete failed stack if it exists (CREATE_FAILED / ROLLBACK_COMPLETE can't be updated)
      - name: Delete failed stack if exists
        run: |
          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name prod-assistant-eks \
            --region ${{ secrets.AWS_REGION }} \
            --query "Stacks[0].StackStatus" \
            --output text 2>/dev/null || echo "DOES_NOT_EXIST")

          echo "Current stack status: $STACK_STATUS"

          if [[ "$STACK_STATUS" == *"FAILED"* || "$STACK_STATUS" == "ROLLBACK_COMPLETE" ]]; then
            echo "Stack is in an unrecoverable state ($STACK_STATUS). Deleting..."
            aws cloudformation delete-stack \
              --stack-name prod-assistant-eks \
              --region ${{ secrets.AWS_REGION }}
            aws cloudformation wait stack-delete-complete \
              --stack-name prod-assistant-eks \
              --region ${{ secrets.AWS_REGION }}
            echo "Stack deleted successfully."
          else
            echo "Stack is in state '$STACK_STATUS' — no deletion needed."
          fi

      # Deploy CloudFormation Stack
      - name: Deploy CloudFormation Stack
        run: |
          aws cloudformation deploy \
            --stack-name prod-assistant-eks \
            --template-file infra/eks-with-ecr.yaml \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --region ${{ secrets.AWS_REGION }}