apiVersion: apps/v1
kind: Deployment
metadata:
  name: prod-assistant
  labels:
    app: prod-assistant
spec:
  replicas: 2
  selector:
    matchLabels:
      app: prod-assistant    
  template:
    metadata:
      labels:
        app: prod-assistant
    spec:
      containers:
      - name: prod-assistant
        image: 700890257528.dkr.ecr.us-east-1.amazonaws.com/prod_assistant
        ports:
        - containerPort: 8001
        env:                              
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: prod-assistant-secrets
              key: OPENAI_API_KEY
        - name: GOOGLE_API_KEY
          valueFrom:
            secretKeyRef:
              name: prod-assistant-secrets
              key: GOOGLE_API_KEY
        - name: ASTRA_DB_API_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: prod-assistant-secrets
              key: ASTRA_DB_API_ENDPOINT
        - name: ASTRA_DB_APPLICATION_TOKEN
          valueFrom:
            secretKeyRef:
              name: prod-assistant-secrets
              key: ASTRA_DB_APPLICATION_TOKEN
        - name: ASTRA_DB_KEYSPACE
          valueFrom:
            secretKeyRef:
              name: prod-assistant-secrets
              key: ASTRA_DB_KEYSPACE